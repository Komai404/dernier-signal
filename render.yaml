services:
  - type: web
    name: dernier-signal
    runtime: node
    plan: free
    buildCommand: "echo aucune installation"
    startCommand: "node server.js"
    healthCheckPath: /api/ping
    envVars:
      - key: ANTHROPIC_API_KEY   # facultatif : bots pilotés par l'IA Claude (voir LISEZ-MOI)
        sync: false
      - key: UPSTASH_REDIS_REST_URL     # facultatif mais conseillé : comptes joueurs permanents (voir LISEZ-MOI)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_PASSWORD     # mot de passe du compte administrateur (voir LISEZ-MOI)
        sync: false
      - key: ADMIN_NAME         # facultatif : pseudo de l'admin (par défaut « admin »)
        sync: false
